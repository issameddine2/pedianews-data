name: Update events

on:
  schedule:
    - cron: "41 5 * * 1"   # every Monday, 05:41 UTC
  workflow_dispatch:        # lets you run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python scripts/update_events.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python scripts/update_fortbildungen.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json fortbildungen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update events"
            git push
          fi
